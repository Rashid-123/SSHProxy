version: '3.8'

services:
   postgres:
    image: postgres:15-alpine
    container_name: SSHProxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: SSHProxy_user
      POSTGRES_PASSWORD: SSHProxy_password
      POSTGRES_DB: SSHProxy_db 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U SSHProxy_user"]
      interval: 10s
      timeout: 5s
      retries: 5

   redis:
    image: redis:7-alpine
    container_name: SSHProxy-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5  

   backend:
    build: ./server
    container_name: SSHProxy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"

volumes:
  postgres_data:
  redis_data: